<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess a number</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="main">
      <h2 class="heading">Number guisig game</h2>
        <div class="template">
            <p class="para">Try and guess a random number between 1 and 100</p>
            <p class="para">You have 10 atempt to guess Number</p>
            <h1 class="msg">Guess a number</h2>
            <input type="" id="num">
            <div class="buttonClass"><button id="button">Submit guess</button></div>
            <div id="userHelp"></div>
            <div class="previous"><span>Previous guess: </span><span id="result"></span></div>
            <div><span>Guess Remaining: </span><span id="remaining">10</span></div>
            <div id="newgame"></div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
